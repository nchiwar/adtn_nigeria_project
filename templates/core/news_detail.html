{% extends 'base.html' %}
{% block content %}
<section class="hero-section" style="background-color: #f5f7fa; color: #1a237e; padding: 48px 0;">
    <div class="container">
        <div class="hero-content" style="display: flex; align-items: center; max-height: 300px;">
            <div class="hero-text" style="flex: 1;">
                <h1 style="font-family: Montserrat, sans-serif; font-size: 40px; font-weight: 700; color: #1a237e;">{{ news.title }}</h1>
                <p style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; color: #1a237e;">Published on {{ news.date|date:"F d, Y" }}</p>
            </div>
        </div>
    </div>
</section>
<section style="background-color: white; padding: 48px 0;">
    <div class="container">
        <p style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; color: #424242; text-align: justify;">{{ news.description }}</p>
        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'news' %}" style="background-color: #3f51b5; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 600;">Back to News</a>
        </div>
    </div>
</section>
{% endblock %}
