{% extends 'base.html' %}
{% block title %}Purchase {{ publication.title }}{% endblock %}
{% block content %}
    <div class="container mt-5">
        <h2 style="font-family: Montserrat, sans-serif; color: #1A237E; font-size: 24px; font-weight: 700; text-align: center;">Purchase {{ publication.title }}</h2>
        <p style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; text-align: center;">Brief: {{ publication.brief_description }}</p>
        <p style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; text-align: center;">Price: ₦{{ publication.price }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary mt-3" style="background-color: #3F51B5; border: none; font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 600;">Confirm Purchase</button>
        </form>
        <a href="/publications" class="btn btn-secondary mt-3" style="font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 600;">Cancel</a>
    </div>
{% endblock %}
