<!-- core/templates/core/job_detail.html (original with correction appended) -->
{% extends 'base.html' %}
{% load static %}
{% block title %}Job Detail - ADTN Nigeria{% endblock %}
{% block content %}
<!-- Hero Section -->
<section class="hero-section" style="background-color: #f5f7fa; color: #1a237e; padding: 48px 0; position: relative; overflow: hidden;">
    <div class="container">
        <div class="hero-content" style="display: flex; align-items: center; max-height: 300px; position: relative; z-index: 1;">
            <div class="hero-text" style="flex: 1;">
                <h1 class="main-title" style="font-family: Montserrat, sans-serif; font-size: 40px; font-weight: 700; margin: 0; color: #1a237e; text-shadow: 1px 1px 2px rgba(0,0,0,0.12);">JOB DETAIL</h1>
                <p class="subtitle" style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; margin-bottom: 1rem; color: #1a237e;">Details of the job opportunity at ADTN Nigeria.</p>
            </div>
        </div>
    </div>
</section>

<!-- Job Detail Section -->
<section class="job-detail-section" style="background-color: white; padding: 48px 0;">
    <div class="container">
        <div class="job-content" style="display: flex; gap: 20px; margin-bottom: 20px; flex-direction: column;">
            <div style="flex: 2;">
                <h2 class="job-title" style="font-family: Montserrat, sans-serif; font-size: 32px; font-weight: 700; color: #1a237e; text-shadow: 1px 1px 2px rgba(0,0,0,0.12); text-align: center;">{{ job.title }}</h2>
                <p class="job-date" style="font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 400; color: #424242; text-align: center;">{{ job.date_posted|date:"F d, Y" }}</p>
                <p class="job-description" style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; color: #424242; text-align: justify; margin-top: 20px;">{{ job.description }}</p>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="{% url 'news' %}" class="btn-back" style="background-color: #3f51b5; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 600;">Back to News</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
