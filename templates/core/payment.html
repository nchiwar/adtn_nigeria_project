{% extends 'base.html' %}
{% load static %}
{% block title %}Payment{% endblock %}
{% block content %}
<section class="hero" style="background-color: #f5f7fa; color: #1a237e; padding: 48px 0; position: relative; overflow: hidden;">
    <div class="container">
        <div class="hero-content" style="display: flex; align-items: center; max-height: 400px;">
            <div class="hero-text">
                <h1 style="font-family: Montserrat, sans-serif; font-size: 40px; font-weight: 700; margin: 0; color: #1a237e; text-shadow: 1px 1px 2px rgba(0,0,0,0.12);">Make a Payment</h1>
                <p style="font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 400; margin-bottom: 1rem; color: #1a237e;">Complete your purchase or registration.</p>
            </div>
        </div>
    </div>
</section>

<section class="payment" style="padding: 48px 0; display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="container">
        <div class="payment-content" style="width: 400px; padding: 24px; background-color: #F5F7FA; border-radius: 4px;">
            <h2 style="font-family: Montserrat, sans-serif; color: #1A237E; font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px;">Payment Details</h2>
            <form id="payment-form">
                <input type="hidden" id="item-type" name="item_type" value="{{ item_type }}">
                <input type="hidden" id="item-name" name="item_name" value="{{ item_name }}">
                <input type="hidden" id="amount" name="amount" value="{{ amount }}">
                <button type="submit" style="background-color: #3F51B5; color: white; font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 600; padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; width: 100%;">Pay Now (₦{{ amount }})</button>
                <div id="payment-message" style="display: none; text-align: center; font-family: Montserrat, sans-serif; font-size: 14px; color: #d32f2f; margin-top: 16px;"></div>
            </form>
        </div>
    </div>
</section>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
    const paystackPublicKey = '{{ paystack_public_key }}';
    const paymentForm = document.getElementById('payment-form');

    paymentForm.addEventListener('submit', function(event) {
        event.preventDefault();
        const message = document.getElementById('payment-message');
        message.style.display = 'none';

        let handler = PaystackPop.setup({
            key: paystackPublicKey,
            email: '{{ request.user.email }}',
            amount: Math.round(parseFloat(document.getElementById('amount').value) * 100), // In kobo
            reference: 'pur-' + Math.floor((Math.random() * 1000000000) + 1),
            metadata: {
                custom_fields: [
                    { display_name: 'Item Type', variable_name: 'item_type', value: document.getElementById('item-type').value },
                    { display_name: 'Item Name', variable_name: 'item_name', value: document.getElementById('item-name').value }
                ]
            },
            callback: function(response) {
                window.location.href = '/purchase-success/?trxref=' + response.trxref + '&item_type=' + document.getElementById('item-type').value + '&item_name=' + encodeURIComponent(document.getElementById('item-name').value) + '&amount=' + document.getElementById('amount').value;
            },
            onClose: function() {
                message.textContent = 'Payment cancelled.';
                message.style.display = 'block';
            }
        });
        handler.openIframe();
    });
</script>
{% endblock %}
