{% extends 'base.html' %}
{% load static %}
{% block title %}Formation of ADTN{% endblock %}
{% block content %}
    <section class="hero-formation" style="background-color: #f5f7fa; color: #1a237e; padding: 48px 0; position: relative; overflow: hidden;">
        <div class="container">
            <div class="hero-content" style="display: flex; align-items: center; max-height: 400px;">
                <div class="hero-text">
                    <h1 style="font-family: Montserrat, sans-serif; font-size: 40px; font-weight: 700; margin: 0; color: #1a237e; text-shadow: 1px 1px 2px rgba(0,0,0,0.12);">FORMATION OF ADTN</h1>
                </div>
            </div>
        </div>
    </section>

    <section class="formation-content" style="padding: 48px 0; background-color: white;">
        <div class="container">
            <p style="font-family: Montserrat, sans-serif; color: #424242; font-size: 16px; font-weight: 400; text-align: justify;">{{ formation_content }}</p>
        </div>
    </section>
{% endblock %}
